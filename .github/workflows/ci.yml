name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install PHP dependencies and lint
        run: |
          composer install --no-interaction --prefer-dist
          composer lint

      - name: Start wp-env and run the PHP and JS tests
        run: |
          npm ci
          npx wp-env start
          npm run test:php
          npm run test:js
          npm run test:release

      - name: Build the zip and check what it holds
        run: npm run test:build

      - name: Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/ecomweb-for-woocommerce

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: ecomweb-for-woocommerce
          path: build/ecomweb-for-woocommerce-*.zip
